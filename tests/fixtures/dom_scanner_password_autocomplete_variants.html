<!--
  Distinguishes autocomplete="current-password" (exact PiiType match) from
  autocomplete="new-password" (no exact PiiType match in server/schemas.py's
  closed enum -- degrades to "other", see dom-scanner.js CONTRACT NOTE).

  Two new-password cases on purpose:
    - #new-alone: autocomplete=new-password with NO type=password signal
      alongside it -> exercises the true enum-gap degrade-to-"other" path.
    - #new-and-type: autocomplete=new-password co-located WITH
      type=password -> type=password is an independently-certain signal
      and wins, resolving to "password" (documented priority rule in
      classifyField()'s doc comment), not "other".
-->
<form>
  <input id="cur" type="password" autocomplete="current-password" />
  <input id="new-alone" type="text" autocomplete="new-password" />
  <input id="new-and-type" type="password" autocomplete="new-password" />
</form>
