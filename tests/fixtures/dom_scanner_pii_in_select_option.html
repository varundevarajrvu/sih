<!--
  <select>'s selected-option visible text carries an Aadhaar-shaped number.
  Cheap bonus coverage per the orchestrator's "if that is cheap" ask --
  scans the currently-selected <option>'s textContent, not its value
  attribute (the textContent is what would actually render on screen).
-->
<select id="idtype">
  <option value="none">Select an ID number</option>
  <option value="aadhaar-example" selected>234567890123</option>
</select>
