<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<title>Sign in</title>
<style>
  body { font-family: Arial, sans-serif; background: #f5f5f7; margin: 0; height: 720px; width: 1280px; display: flex; align-items: center; justify-content: center; }
  .card { background: #fff; border: 1px solid #ddd; border-radius: 8px; padding: 40px; width: 360px; box-shadow: 0 2px 8px rgba(0,0,0,0.08); }
  h1 { font-size: 20px; margin: 0 0 20px; }
  label { display: block; font-size: 13px; margin: 12px 0 4px; color: #333; }
  input { width: 100%; box-sizing: border-box; padding: 8px; border: 1px solid #ccc; border-radius: 4px; font-size: 14px; }
  button { margin-top: 20px; width: 100%; padding: 10px; background: #2563eb; color: #fff; border: none; border-radius: 4px; font-size: 14px; cursor: pointer; }
</style>
</head>
<body>
  <div class="card">
    <h1>Sign in to your account</h1>
    <form>
      <label for="email">Email</label>
      <input id="email" type="email" autocomplete="email" placeholder="you@example.com">
      <label for="password">Password</label>
      <input id="password" type="password" autocomplete="current-password" placeholder="Password">
      <button type="submit">Sign in</button>
    </form>
  </div>
</body>
</html>
